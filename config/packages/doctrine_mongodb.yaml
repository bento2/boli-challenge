doctrine_mongodb:
    auto_generate_proxy_classes: true
    auto_generate_hydrator_classes: true
    connections:
        # Connexion pour la base de test
        test:
            server: "%env(string:MONGODB_URI)%"
            options:
                username: "%env(string:MONGODB_USERNAME)%"
                password: "%env(string:MONGODB_PASSWORD)%"
                authSource: admin

        # Connexion pour la base diabetes
        diabetes:
            server: "%env(MONGODB_URI)%"
            options:
                username: "%env(MONGODB_USERNAME)%"
                password: "%env(MONGODB_PASSWORD)%"

        # Connexion pour la base wellness
        wellness:
            server: "%env(MONGODB_URI)%"
            options:
                username: "%env(MONGODB_USERNAME)%"
                password: "%env(MONGODB_PASSWORD)%"

        # Connexion pour la base maternity
        maternity:
            server: "%env(MONGODB_URI)%"
            options:
                username: "%env(MONGODB_USERNAME)%"
                password: "%env(MONGODB_PASSWORD)%"
    default_database: "test"
    document_managers:
        # Document Manager pour test
        test:
            connection: test
            database: test_db
            mappings:
                Test:
                    type: attribute
                    dir: "%kernel.project_dir%/src/Document"
                    prefix: 'App\Document'
                    is_bundle: false

        # Document Manager pour diabetes (par défaut)
        default:
            connection: diabetes
            database: diabetes_db
            mappings:
                Diabetes:
                    type: attribute
                    dir: "%kernel.project_dir%/src/Document/Diabetes"
                    prefix: 'App\Document\Diabetes'
                    is_bundle: false

        # Document Manager pour wellness
        wellness:
            connection: wellness
            database: wellness_db
            mappings:
                Wellness:
                    type: attribute
                    dir: "%kernel.project_dir%/src/Document/Wellness"
                    prefix: 'App\Document\Wellness'
                    is_bundle: false

        # Document Manager pour maternity
        maternity:
            connection: maternity
            database: maternity_db
            mappings:
                Maternity:
                    type: attribute
                    dir: "%kernel.project_dir%/src/Document/Maternity"
                    prefix: 'App\Document\Maternity'
                    is_bundle: false

when@prod:
    doctrine_mongodb:
        auto_generate_proxy_classes: false
        auto_generate_hydrator_classes: false
        document_managers:
            default:
                metadata_cache_driver:
                    type: service
                    id: doctrine_mongodb.system_cache_pool

    framework:
        cache:
            pools:
                doctrine_mongodb.system_cache_pool:
                    adapter: cache.system
